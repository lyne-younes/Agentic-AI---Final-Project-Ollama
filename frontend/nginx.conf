server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API: strip /api and forward to FastAPI, so the session cookie is first-party.
    location /api/ {
        proxy_pass http://backend:8000/;
        # An agent turn can take minutes on a local model.
        proxy_read_timeout 1800s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints these, so a new build is a new URL and they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate index.html so the browser picks up a new build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: unknown paths fall back to index.html so react-router handles them.
    location / {
        try_files $uri /index.html;
    }
}
